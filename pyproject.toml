[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "predykt"
dynamic = ["version"]
description = "A rigorous Python toolkit for predictive ML — feature analysis, interaction testing, and model robustness validation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Hisham Salem", email = "predktpackage@gmail.com"},
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "shap>=0.41",
    # optbinning and scikit-learn have to be pinned as a pair, and the pair that
    # works depends on the Python version.
    #
    # optbinning <=0.20.1 calls check_array(force_all_finite=...), an argument
    # removed in scikit-learn 1.8; 0.21.0 is the first release using
    # ensure_all_finite, and it declares scikit-learn >=1.6.
    #
    # But 0.20.1 and 0.21.0 also cap ortools <9.12, and ortools publishes no
    # wheel below 9.12 for Python 3.13+ and no sdist to build from. So on 3.13+
    # the newest installable optbinning is 0.20.0, which still needs the
    # scikit-learn <1.8 cap. Requiring optbinning >=0.21 unconditionally would
    # make predykt uninstallable on 3.13 and 3.14 with a resolver error naming
    # ortools, a package the user never asked for.
    "scikit-learn>=1.6; python_version < '3.13'",
    "scikit-learn>=1.1,<1.8; python_version >= '3.13'",
    "optbinning>=0.21; python_version < '3.13'",
    "optbinning>=0.17,<0.20.1; python_version >= '3.13'",
    "scipy>=1.9",
    "statsmodels>=0.13",
    "tqdm>=4.64",
    "joblib>=1.1",
    "numba>=0.56",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
test = [
    "pytest>=7",
    "lightgbm>=3.3",
    # shap >= 0.50 requires Python >= 3.11, so on 3.10 the newest installable
    # shap is 0.49.1 — which predates the fix for the bracketed base_score that
    # xgboost >= 3.1 writes into its model JSON. TreeExplainer then dies with
    # "could not convert string to float: '[5.4E-1]'". Bisected on Python 3.10
    # against shap 0.49.1: 2.1.4 OK, 3.0.0 OK, 3.1.0 FAILS, 3.2.0 FAILS.
    "xgboost>=1.7,<3.1; python_version < '3.11'",
    "xgboost>=1.7; python_version >= '3.11'",
    "catboost>=1.2",
]
plot = ["matplotlib>=3.5", "seaborn>=0.12"]

[project.urls]
Homepage = "https://github.com/HishamSalem/predykt"
Documentation = "https://github.com/HishamSalem/predykt#readme"
Issues = "https://github.com/HishamSalem/predykt/issues"

# Version is derived from the latest git tag (e.g. v0.2.0 -> 0.2.0).
# No version string lives in any file; tag the release and build.
[tool.setuptools_scm]
version_file = "predykt/_version.py"
# Engages only when setuptools-scm cannot detect a version at all — i.e. when
# there is no .git (building from an sdist or a downloaded zip), which would
# otherwise raise LookupError and fail the build outright.
#
# It does NOT suppress the PEP 440 local segment on an untagged git checkout:
# such a build still resolves to 0.0.0.devN+g<hash>, which the PyPI upload API
# rejects. That rejection is a deliberate safety net, not a bug — the fix is to
# tag before building (see CONTRIBUTING.md), not to strip the local segment.
fallback_version = "0.0.0.dev0"

[tool.setuptools.packages.find]
where = ["."]
# Declare what ships rather than enumerating what does not. packages.find
# defaults to namespaces = true, so any top-level directory is discovered as a
# namespace package even without __init__.py — which is how docs/ and tasks/
# ended up inside the wheel. An include list cannot regress when a new
# directory is added at the root.
include = ["predykt*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
