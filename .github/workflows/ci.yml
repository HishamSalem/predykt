name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history to see tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Error-level checks block; style-level cleanup can tighten this later
      - run: ruff check predykt tests --select F,E9

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is not optional coverage. optbinning caps ortools <9.12 from
        # 0.20.1 on, and no ortools below 9.12 ships a wheel for 3.13+, so the
        # dependency pins fork at 3.13: <=3.12 resolves optbinning 0.21 with an
        # uncapped scikit-learn, 3.13+ resolves optbinning 0.20.0 with
        # scikit-learn <1.8. Without a 3.13 job the second branch has no
        # coverage at all. When optbinning relaxes the ortools cap and both
        # branches resolve alike, the fork in pyproject.toml can be deleted.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # setuptools-scm needs full history to see tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with test extras
        run: pip install -e ".[test]"
      - name: Run test suite
        run: pytest -q --tb=short
